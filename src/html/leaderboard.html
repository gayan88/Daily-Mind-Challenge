<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaderboard - Daily Mind Challenge</title>
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/pages/leaderboard.css">
</head>
<body>
    <div id="site-header"></div>

    <div class="content">
        <div class="section">
            <div class="section-title">Leaderboard</div>
            <div class="lb-tabs">
                <button class="lb-tab active" data-game="overall" type="button">Overall</button>
                <button class="lb-tab" data-game="wordle" type="button">Wordle</button>
                <button class="lb-tab" data-game="sudoku" type="button">Sudoku</button>
                <button class="lb-tab" data-game="wordsearch" type="button">Word Search</button>
            </div>
            <div class="lb-period-tabs">
                <button class="lb-period-tab active" data-period="today" type="button">Today</button>
                <button class="lb-period-tab" data-period="week" type="button">Week</button>
                <button class="lb-period-tab" data-period="month" type="button">Month</button>
                <button class="lb-period-tab" data-period="year" type="button">Year</button>
                <button class="lb-period-tab" data-period="all" type="button">All-time</button>
            </div>
            <div class="leaderboard-table" id="leaderboard-full">
                <div class="loading-text">Loading&hellip;</div>
            </div>
        </div>
    </div>

    <div id="site-footer"></div>

    <script type="module" src="/js/leaderboard/leaderboard-page.js"></script>
</body>
</html>
