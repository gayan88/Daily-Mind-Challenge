<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/assets/images/logo-header.png">
    <title>Leaderboard - Daily Mind Challenge</title>
    <meta name="description" content="See who's leading today's Wordle, Sudoku, and Word Search rankings on Daily Mind Challenge — filter by game and by Today, Week, Month, Year, or All-time.">
    <link rel="canonical" href="https://dailymindchallenge.com/leaderboard">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://dailymindchallenge.com/leaderboard">
    <meta property="og:title" content="Leaderboard - Daily Mind Challenge">
    <meta property="og:description" content="Play daily Wordle, Sudoku, and Word Search puzzles, earn points, and climb the leaderboard on Daily Mind Challenge.">
    <meta property="og:image" content="https://dailymindchallenge.com/assets/images/fb-share-general.png">
    <meta property="og:image:width" content="1731">
    <meta property="og:image:height" content="909">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Leaderboard - Daily Mind Challenge">
    <meta name="twitter:description" content="Play daily Wordle, Sudoku, and Word Search puzzles, earn points, and climb the leaderboard on Daily Mind Challenge.">
    <meta name="twitter:image" content="https://dailymindchallenge.com/assets/images/fb-share-general.png">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/pages/leaderboard.css">
</head>
<body>
    <div id="site-header"></div>

    <div class="content">
        <div class="section">
            <div class="section-title">Leaderboard</div>
            <div class="lb-filters">
                <div class="lb-filter">
                    <label for="lb-game-select">Game</label>
                    <select id="lb-game-select">
                        <option value="overall">Overall</option>
                    </select>
                </div>
                <div class="lb-filter">
                    <label for="lb-period-select">Period</label>
                    <select id="lb-period-select">
                        <option value="today">Today</option>
                        <option value="week">Week</option>
                        <option value="month">Month</option>
                        <option value="year">Year</option>
                        <option value="all">All-time</option>
                    </select>
                </div>
            </div>
            <div class="lb-your-rank" id="lb-your-rank" hidden></div>
            <div class="leaderboard-table" id="leaderboard-full">
                <div class="loading-text">Loading&hellip;</div>
            </div>
        </div>
    </div>

    <div id="site-footer"></div>

    <script type="module" src="/js/leaderboard/leaderboard-page.js"></script>
</body>
</html>
