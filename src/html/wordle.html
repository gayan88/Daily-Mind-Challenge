<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/assets/images/logo-header.png">
    <title>Wordle - Daily Mind Challenge</title>
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/pages/wordle.css">
</head>
<body>
    <div id="site-header"></div>

    <div class="content">
        <div class="ad-space" data-ad-slot="wordle-top">Google AdSense - Ad Space (300x250)</div>

        <div class="section">
            <div class="section-title">Wordle</div>
            <div class="wordle-mode-tabs">
                <button class="wordle-mode-tab active" data-mode="daily" type="button">Daily Challenge</button>
                <button class="wordle-mode-tab" data-mode="tournaments" type="button">Tournaments</button>
                <button class="wordle-mode-tab" data-mode="challenges" type="button">Challenge a Friend</button>
            </div>
            <div class="game-container">
                <div id="game-mount">
                    <div class="loading-text">Loading&hellip;</div>
                </div>
            </div>
        </div>

        <div class="ad-space" data-ad-slot="wordle-bottom">Google AdSense - Ad Space (300x250)</div>
    </div>

    <div id="site-footer"></div>

    <script type="module" src="/js/games/wordle/wordle-page.js"></script>
</body>
</html>
