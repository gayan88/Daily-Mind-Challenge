<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sudoku - Daily Mind Challenge</title>
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/pages/sudoku.css">
</head>
<body>
    <div id="site-header"></div>

    <div class="content">
        <div class="ad-space" data-ad-slot="sudoku-top">Google AdSense - Ad Space (300x250)</div>

        <div class="section">
            <div class="section-title">Sudoku</div>
            <div class="sudoku-mode-tabs">
                <button class="sudoku-mode-tab active" data-mode="daily" type="button">Daily Challenge</button>
                <button class="sudoku-mode-tab" data-mode="classic" type="button">Classic Sudoku</button>
                <button class="sudoku-mode-tab" data-mode="tournament" type="button">Tournament</button>
            </div>
            <div class="game-container">
                <div id="game-mount">
                    <div class="loading-text">Loading&hellip;</div>
                </div>
            </div>
        </div>

        <div class="ad-space" data-ad-slot="sudoku-bottom">Google AdSense - Ad Space (300x250)</div>
    </div>

    <div id="site-footer"></div>

    <script type="module" src="/js/games/sudoku/sudoku-page.js"></script>
</body>
</html>
