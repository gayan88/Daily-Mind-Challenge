<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/assets/images/logo-header.png">
    <title>Profile - Daily Mind Challenge</title>
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://daily-mind-challenge.web.app/profile">
    <meta property="og:title" content="Profile - Daily Mind Challenge">
    <meta property="og:description" content="Play daily Wordle, Sudoku, and Word Search puzzles, earn points, and climb the leaderboard on Daily Mind Challenge.">
    <meta property="og:image" content="https://daily-mind-challenge.web.app/assets/images/fb-share-general.png">
    <meta property="og:image:width" content="1731">
    <meta property="og:image:height" content="909">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Profile - Daily Mind Challenge">
    <meta name="twitter:description" content="Play daily Wordle, Sudoku, and Word Search puzzles, earn points, and climb the leaderboard on Daily Mind Challenge.">
    <meta name="twitter:image" content="https://daily-mind-challenge.web.app/assets/images/fb-share-general.png">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/pages/profile.css">
</head>
<body>
    <div id="site-header"></div>

    <div class="content">
        <div class="section">
            <div class="section-title">Your Profile</div>
            <div class="card">
                <div class="form-field">
                    <label for="display-name-input">Display name</label>
                    <input type="text" id="display-name-input" maxlength="24">
                </div>
                <button class="btn primary" id="save-name-btn" type="button">Save</button>

                <div class="profile-stats" id="profile-stats"></div>
            </div>
        </div>

        <div class="section">
            <div class="section-title">Recent activity</div>
            <div class="card" id="profile-history">
                <div class="loading-text">Loading&hellip;</div>
            </div>
        </div>
    </div>

    <div id="site-footer"></div>

    <script type="module" src="/js/pages/profile.js"></script>
</body>
</html>
