<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Challenges - Daily Mind Challenge</title>
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/pages/wordle.css">
    <link rel="stylesheet" href="../css/pages/challenges.css">
</head>
<body>
    <div id="site-header"></div>

    <div class="content">
        <!-- Solve view: shown when the URL has ?id=<challengeId> -->
        <div class="section" id="solve-view" hidden>
            <a href="challenges.html" class="back-link">&larr; Back to Challenges</a>
            <div class="section-title">Solve Challenge</div>
            <div class="game-container">
                <div id="solve-mount">
                    <div class="loading-text">Loading&hellip;</div>
                </div>
            </div>
        </div>

        <!-- Browse/Create view: shown when there's no ?id= -->
        <div id="browse-view">
            <div class="section" id="create-section">
                <div class="section-title">Create a Challenge</div>
                <div class="card">
                    <div class="challenge-form-row">
                        <div class="form-field">
                            <label for="word-select">Choose a word</label>
                            <select id="word-select"></select>
                        </div>
                        <button class="btn" id="random-word-btn" type="button">Random</button>
                        <button class="btn primary" id="create-btn" type="button">Create Challenge</button>
                    </div>
                    <div id="share-result"></div>
                </div>
            </div>

            <div class="section">
                <div class="section-title">Open Challenges</div>
                <div id="challenges-list">
                    <div class="loading-text">Loading&hellip;</div>
                </div>
            </div>
        </div>
    </div>

    <div id="site-footer"></div>

    <script type="module" src="../js/pages/challenges.js"></script>
</body>
</html>
