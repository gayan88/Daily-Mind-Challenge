<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Daily Mind Challenge</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/pages/login.css">
</head>
<body>
    <div class="auth-page">
        <div class="auth-logo">
            <span class="logo-icon" data-icon="LOGO"></span>
            <span>Daily Mind Challenge</span>
        </div>

        <div class="auth-card">
            <div class="auth-tabs">
                <button class="auth-tab active" id="tab-guest" type="button">Guest</button>
                <button class="auth-tab" id="tab-login" type="button">Log In</button>
                <button class="auth-tab" id="tab-signup" type="button">Sign Up</button>
            </div>

            <div class="auth-error" id="auth-error"></div>

            <!-- Guest panel -->
            <div class="auth-panel active" id="panel-guest">
                <div class="form-field">
                    <label for="guest-name">Display name</label>
                    <input type="text" id="guest-name" maxlength="24" placeholder="e.g. PuzzleFan">
                </div>
                <button class="btn primary" id="guest-submit" type="button" style="width: 100%;">Continue as Guest</button>
                <div class="form-hint">Guests can play and appear on the leaderboard, but can't earn daily login points, create challenges, or change their name later.</div>
            </div>

            <!-- Login panel -->
            <div class="auth-panel" id="panel-login">
                <div class="form-field">
                    <label for="login-username">Username</label>
                    <input type="text" id="login-username" maxlength="24">
                </div>
                <div class="form-field">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password">
                </div>
                <button class="btn primary" id="login-submit" type="button" style="width: 100%;">Log In</button>
                <div class="auth-forgot"><a href="#" id="forgot-password-link">Forgot password?</a></div>
            </div>

            <!-- Sign up panel -->
            <div class="auth-panel" id="panel-signup">
                <div class="form-field">
                    <label for="signup-username">Username</label>
                    <input type="text" id="signup-username" maxlength="24">
                </div>
                <div class="form-field">
                    <label for="signup-displayname">Display name</label>
                    <input type="text" id="signup-displayname" maxlength="24">
                </div>
                <div class="form-field">
                    <label for="signup-password">Password</label>
                    <input type="password" id="signup-password">
                </div>
                <div class="form-hint">At least 8 characters, with 1 uppercase letter and 1 number.</div>
                <div class="form-field">
                    <label for="signup-email">Email (optional, only needed for password reset)</label>
                    <input type="email" id="signup-email">
                </div>
                <button class="btn primary" id="signup-submit" type="button" style="width: 100%;">Sign Up</button>
            </div>
        </div>
    </div>

    <script type="module" src="js/pages/login.js"></script>
</body>
</html>
