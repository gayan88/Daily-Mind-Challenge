<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - Daily Mind Challenge</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/pages/settings.css">
</head>
<body>
    <div id="site-header"></div>

    <div class="content" id="settings-content">
        <div class="section">
            <div class="section-title">Account</div>
            <div class="card">
                <div class="form-field">
                    <label for="display-name-input">Display name</label>
                    <input type="text" id="display-name-input" maxlength="24">
                </div>
                <div class="form-field">
                    <label for="email-input">Recovery email (optional, used for password reset)</label>
                    <input type="email" id="email-input">
                </div>
                <button class="btn primary" id="save-account-btn" type="button">Save</button>
            </div>
        </div>

        <div class="section">
            <div class="section-title">Password</div>
            <div class="card">
                <div class="form-field">
                    <label for="new-password-input">New password</label>
                    <input type="password" id="new-password-input">
                </div>
                <div class="form-hint">At least 8 characters, with 1 uppercase letter and 1 number.</div>
                <button class="btn primary" id="change-password-btn" type="button">Change Password</button>
            </div>
        </div>
    </div>

    <div id="site-footer"></div>

    <script type="module" src="js/pages/settings.js"></script>
</body>
</html>
